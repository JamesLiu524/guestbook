{% extends "base.html" %}

{% block content %}
  {% if session.admin %}
    <div class="admin-bar">
      <span>🔑 管理员模式</span>
      <form action="{{ url_for('logout') }}" method="post" class="inline">
        <button class="small gray">退出登录</button>
      </form>
    </div>
  {% endif %}

  <h1>留言板 ✍️</h1>

  <form action="{{ url_for('post') }}" method="post" class="stack">
    <input name="name" placeholder="你的名字" maxlength="20" required>
    <textarea name="content" placeholder="想说点什么？" maxlength="500" required></textarea>
    <button type="submit">提交留言</button>
  </form>

  {% for m in messages %}
    <div class="msg">
      <div class="meta">
        <span><strong>{{ m.name }}</strong> · {{ m.created_at }}</span>
        {% if session.admin %}
          <form action="{{ url_for('delete', message_id=m.id) }}" method="post" class="inline"
                onsubmit="return confirm('确定删除这条留言吗？')">
            <button class="small">删除</button>
          </form>
        {% endif %}
      </div>
      <p class="content">{{ m.content }}</p>
    </div>
  {% else %}
    <p class="empty">还没有留言，来做第一个吧！</p>
  {% endfor %}
{% endblock %}
