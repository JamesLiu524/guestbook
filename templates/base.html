<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}James 的留言板{% endblock %}</title>
  <style>
    body {
      background: #fbfaf7;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 16px;
      line-height: 1.7;
      color: #333;
    }
    h1 { color: #d62828; }
    form.stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 40px; }
    input, textarea {
      font: inherit;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    textarea { min-height: 100px; resize: vertical; }
    button {
      font: inherit;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: #d62828;
      color: white;
      cursor: pointer;
    }
    .msg { border-bottom: 1px solid #eee; padding: 12px 0; }
    .meta { font-size: 14px; color: #888; display: flex; align-items: center; gap: 8px; }
    .meta strong { color: #333; }
    .content { margin: 4px 0 0; white-space: pre-wrap; }
    .empty { color: #888; }
    .admin-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff4e5; padding: 8px 12px; border-radius: 8px; margin-bottom: 24px;
    }
    .inline { display: inline; margin: 0; }
    .small { padding: 2px 10px; font-size: 13px; }
    .gray { background: #888; }
    .error { color: #d62828; }
    .site-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 32px;
      border-bottom: 1px solid #eee;
      font-size: 15px;
    }
    .site-nav a { color: #555; text-decoration: none; }
    .site-nav .brand { color: #d62828; font-weight: 600; }
    .site-nav .links { display: flex; gap: 16px; }
    .site-nav .links a:hover { color: #d62828; }
    .site-nav .links a.active { color: #d62828; font-weight: 600; }
  </style>
</head>
<body>
    <nav class="site-nav">
    <a class="brand" href="https://kiteroot.com">🪁 kiteroot</a>
    <div class="links">
      <a href="https://kiteroot.com">主页</a>
      <a href="https://blog.kiteroot.com">博客</a>
      <a href="https://guestbook.kiteroot.com" class="active">留言板</a>
    </div>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
